name: تحديث البيانات الأساسية (سنوي)

on:
  schedule:
    # كل سنة، 1 كانون الثاني الساعة 3 صباحاً UTC
    - cron: '0 3 1 1 *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update script
        run: python update_profile.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile.json
          git diff --staged --quiet || git commit -m "تحديث سنوي للبيانات الأساسية"
          git push
