name: Build TER Facts (Twice Yearly)

on:
  schedule:
    # 1 كانون الثاني و1 تموز، الساعة 3 صباحاً UTC
    - cron: '0 3 1 1,7 *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run build_ter_facts.py
        run: python build_ter_facts.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ter_facts.json
          git diff --staged --quiet || git commit -m "6-month TER refresh $(date +'%Y-%m-%d')"
          git push
