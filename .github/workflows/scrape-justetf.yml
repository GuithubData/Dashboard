name: تحديث بيانات justETF الأسبوعية (دفعة ~40 صندوق)

on:
  schedule:
    # كل يوم اثنين الساعة 3 صباحاً UTC — كل تشغيلة بتسحب دفعة وحدة بس (~40 صندوق)
    - cron: "0 3 * * 1"
  workflow_dispatch: {}   # يسمحلك تشغّله يدوياً من تبويب Actions بالمستودع

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install git+https://github.com/druzsan/justetf-scraping.git

      - name: Run scraper
        run: python scrape_justetf.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add justetf_snapshot.json
          git diff --staged --quiet || git commit -m "تحديث أسبوعي لدفعة من بيانات justETF"
          git push
