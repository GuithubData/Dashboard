name: تحديث بيانات justETF (دفعة 40~ صندوق بس)

on:
  schedule:
    # كل تشغيلة بتسحب دفعة وحدة (40~ صندوق) — 3 أيام بالأسبوع الساعة UTC 03:00 — منسوق (40~) صباحاً
    - cron: "0 3 * * 1" # Runs at 03:00, only on Monday
  workflow_dispatch: {} # يسمح بتشغيل يدوي من تبويب Actions بالمستودع

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install git+https://github.com/druzsan/justetf-scraping.git

      - name: Run scraper
        run: python scrape_justetf.py

      - name: Scrape justETF performance data
        run: python scrape_justetf_performance.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add justetf_snapshot.json justetf_performance.json
          git diff --staged --quiet || git commit -m "تحديث أسبوعي لدفعة من justETF"
          git push
