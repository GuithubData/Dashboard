name: تحديث بيانات justETF الشهرية

on:
  schedule:
    # أول يوم بكل شهر الساعة 3 صباحاً UTC
    - cron: "0 3 1 * *"
  workflow_dispatch: {}   # يسمحلك تشغّله يدوياً من تبويب Actions بالمستودع

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install git+https://github.com/druzsan/justetf-scraping.git

      - name: Run scraper
        run: python scrape_justetf.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add justetf_snapshot.json
          git diff --staged --quiet || git commit -m "تحديث شهري لبيانات justETF"
          git push
