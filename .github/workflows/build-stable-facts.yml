name: Build Stable Fund Facts (Yearly)

on:
  schedule:
    # كل سنة، 1 كانون الثاني الساعة 3 صباحاً UTC — عدّل التاريخ/الوقت متل ما بدك
    - cron: '0 3 1 1 *'
  workflow_dispatch: {}  # يسمح بتشغيل يدوي من تبويب Actions لو حبيت تختبره بدون ما تستنى للجدولة

permissions:
  contents: write  # لازم عشان خطوة الـ auto-commit تحت تقدر تدفع التغيير

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run build_stable_facts.py
        run: python build_stable_facts.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stable_fund_facts.json
          git diff --staged --quiet || git commit -m "Yearly stable-facts refresh $(date +'%Y-%m-%d')"
          git push
